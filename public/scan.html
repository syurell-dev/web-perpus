<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="view-transition" content="same-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Scan - Perpustakaan Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.011em;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      color: #0f172a;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(15,23,42,0.04), 0 1px 2px rgba(15,23,42,0.03);
    }

    .scan-input {
      width: 100%; padding: 18px 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem; font-weight: 500; color: #0f172a;
      background: #fff; border: 2px solid #a7f3d0;
      border-radius: 12px; outline: none;
      transition: all 0.2s ease;
    }
    .scan-input::placeholder { color: #94a3b8; }
    .scan-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16,185,129,0.12), 0 4px 12px -4px rgba(16,185,129,0.25);
    }

    /* Status icon */
    #status-icon-wrap {
      width: 68px; height: 68px; margin: 0 auto 14px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #ecfdf5, #d1fae5);
      color: #059669;
      transition: all 0.3s ease;
    }
    #status-icon-wrap svg { width: 34px; height: 34px; }
    #status-icon-wrap.success { background: linear-gradient(135deg, #ecfdf5, #a7f3d0); color: #047857; }
    #status-icon-wrap.error   { background: linear-gradient(135deg, #fef2f2, #fecaca); color: #b91c1c; }
    #status-icon-wrap.warn    { background: linear-gradient(135deg, #fffbeb, #fde68a); color: #b45309; }
    #status-icon-wrap.processing { background: linear-gradient(135deg, #eff6ff, #bfdbfe); color: #1d4ed8; }

    .list-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: #f0fdf4; border: 1px solid #a7f3d0; border-radius: 12px;
      animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      transition: all 0.2s ease;
    }
    .list-item:hover { border-color: #34d399; transform: translateX(2px); }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .list-num {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.8rem; flex-shrink: 0;
    }

    .log-item {
      padding: 7px 11px; border-left: 2px solid #e2e8f0;
      font-size: 0.78rem; line-height: 1.5;
      animation: fadeIn 0.25s ease;
    }
    .log-item.success { border-left-color: #10b981; color: #047857; }
    .log-item.error   { border-left-color: #ef4444; color: #b91c1c; }
    .log-item.warn    { border-left-color: #f59e0b; color: #b45309; }
    .log-item.info    { border-left-color: #cbd5e1; color: #475569; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .log-time { color: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; margin-right: 6px; }

    .section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #64748b;
    }

    #btn-exit {
      width: 44px; height: 44px; border-radius: 12px;
      background: #fff; border: 1px solid #e2e8f0; color: #475569;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s ease;
    }
    #btn-exit:hover {
      background: #fef2f2; border-color: #fecaca; color: #dc2626;
    }

    .icon { width: 16px; height: 16px; flex-shrink: 0; }
    .icon-lg { width: 20px; height: 20px; flex-shrink: 0; }

    #modal-sukses { animation: fadeIn 0.2s ease; }
    #modal-sukses > div { animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.94) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/pengingat.css">
  <link rel="stylesheet" href="/css/print.css" media="print">
</head>
<body>
  <div style="padding: 24px; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- HEADER -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
      <div>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
          <span style="width: 8px; height: 8px; background: #10b981; border-radius: 50%;
                       box-shadow: 0 0 0 4px rgba(16,185,129,0.15);"></span>
          <span style="font-size: 0.7rem; font-weight: 700; color: #059669;
                       letter-spacing: 0.08em; text-transform: uppercase;">
            Scanner Aktif
          </span>
        </div>
        <h1 style="font-size: 1.7rem; font-weight: 800; color: #0f172a; letter-spacing: -0.03em;">
          Mode Scan
        </h1>
        <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">
          Scan buku satu-satu, lalu scan kartu anggota — diproses otomatis
        </p>
      </div>
      <button id="btn-exit" title="Keluar (Esc)">
        <svg class="icon-lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <!-- GRID -->
    <div style="display: grid; grid-template-columns: 1fr 340px; gap: 20px; flex: 1; min-height: 0;">

      <!-- LEFT -->
      <div style="display: flex; flex-direction: column; gap: 16px; min-height: 0;">

        <!-- INPUT -->
        <div class="card" style="padding: 22px;">
          <div class="section-title" style="margin-bottom: 12px;">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
              <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            </svg>
            Scan Barcode
                      <div class="section-title" style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
              </svg>
              Scan Barcode
            </div>
            <!-- TOGGLE SWITCH BARU -->
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; background: #f1f5f9; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: #475569; transition: all 0.2s;" id="label-force-return">
              <input type="checkbox" id="toggle-force-return" style="width: 14px; height: 14px; cursor: pointer; accent-color: #dc2626;">
              Mode Kembalikan
            </label>
          </div>

          </div>
          <input id="scan-input" type="text" autocomplete="off" class="scan-input"
            placeholder="Scan Buku (untuk pinjam) ATAU Scan NIS (untuk baca)...">
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px;
                      font-size: 0.75rem; color: #94a3b8;">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
            </svg>
            <span>💡 Scan Buku dulu jika ingin meminjam. Langsung scan Kartu jika hanya membaca.</span>
          </div>
        </div>

        <!-- STATUS -->
        <div id="status-box" class="card" style="padding: 28px; text-align: center; transition: all 0.3s ease;">
          <div id="status-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
            </svg>
          </div>
          <div id="status-text" style="font-size: 1.15rem; font-weight: 700; color: #0f172a; letter-spacing: -0.01em;">
            Siap Scan Buku
          </div>
          <div id="status-sub" style="font-size: 0.85rem; color: #64748b; margin-top: 6px;">
            Scan buku yang mau dipinjam atau dikembalikan
          </div>
        </div>

        <!-- LIST -->
        <div id="list-box" class="card" style="padding: 20px; flex: 1; overflow-y: auto; min-height: 0; display: none;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
            <div class="section-title">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                <path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
              </svg>
              Buku Ter-scan
            </div>
            <span id="list-count" style="font-size: 0.7rem; background: #d1fae5; color: #047857;
                                          padding: 4px 10px; border-radius: 999px; font-weight: 700;">
              0 buku
            </span>
          </div>
          <div id="list-content" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

      </div>

      <!-- RIGHT: LOG -->
      <div class="card" style="padding: 20px; overflow-y: auto; min-height: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
          <div class="section-title">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>
            </svg>
            Aktivitas
          </div>
          <button id="btn-clear-log" style="font-size: 0.72rem; color: #94a3b8; background: none;
                                             border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px;">
            Clear
          </button>
        </div>
        <div id="log" style="display: flex; flex-direction: column;"></div>
      </div>

    </div>
  </div>

  <!-- MODAL SUKSES -->
  <div id="modal-sukses" style="display: none; position: fixed; inset: 0; z-index: 9999;
                                  background: rgba(15,23,42,0.5); backdrop-filter: blur(4px);
                                  align-items: center; justify-content: center; padding: 16px;">
    <div style="background: #fff; border-radius: 20px; padding: 32px;
                max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto;
                box-shadow: 0 25px 50px -12px rgba(15,23,42,0.25);">
      <div style="text-align: center; margin-bottom: 20px;">
        <div style="width: 76px; height: 76px; background: linear-gradient(135deg, #ecfdf5, #a7f3d0);
                    border-radius: 20px; display: flex; align-items: center; justify-content: center;
                    margin: 0 auto 14px; color: #047857;">
          <svg style="width:38px;height:38px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </div>
        <h2 style="font-size: 1.4rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">Selesai!</h2>
        <p id="sukses-sub" style="color: #64748b; font-size: 0.85rem; margin-top: 4px;"></p>
      </div>
      <div id="sukses-detail" style="text-align: left; display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
  // ================================================================
  // SVG helper
  // ================================================================
  const SVG = {
    book:   '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
    check:  '<path d="M20 6 9 17l-5-5"/>',
    alert:  '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    loader: '<path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/>',
    x:      '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    bookSm: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
    checkSm:'<path d="M20 6 9 17l-5-5"/>'
  };
  function svgIcon(name, size) {
    size = size || 36;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                 style="width:${size}px;height:${size}px;">${SVG[name]}</svg>`;
  }

  const state = { bukuList: [], processing: false, forceReturn: false };
  async function masukFullscreen() {
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch(e){}
  }
  function keluar() {
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    window.location.href = '/';
  }
  document.addEventListener('click', masukFullscreen, { once: true });
  document.addEventListener('keydown', masukFullscreen, { once: true });

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  let audioCtx = null;
  function beep(freq, dur) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.2, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }
  const beepOk   = () => beep(1000, 0.12);
  const beepErr  = () => { beep(300, 0.25); setTimeout(() => beep(250, 0.25), 150); };
  const beepWarn = () => beep(600, 0.15);
  const beepBig  = () => { beepOk(); setTimeout(beepOk, 100); setTimeout(beepOk, 200); };

  function showStatus(text, sub, type) {
    type = type || 'info';
    const wrap = document.getElementById('status-icon-wrap');
    const textEl = document.getElementById('status-text');
    wrap.className = type === 'info' ? '' : type;

    const iconMap = {
      info: 'book',
      success: 'check',
      error: 'alert',
      warn: 'alert',
      processing: 'loader'
    };
    wrap.innerHTML = svgIcon(iconMap[type] || 'book', 34);

    textEl.textContent = text;
    textEl.style.color = type === 'success' ? '#047857'
                      : type === 'error'   ? '#b91c1c'
                      : type === 'warn'    ? '#b45309'
                      : '#0f172a';
    document.getElementById('status-sub').textContent = sub || '';
  }

  function addLog(msg, type) {
    type = type || 'info';
    const t = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const el = document.createElement('div');
    el.className = 'log-item ' + type;
    el.innerHTML = `<span class="log-time">${t}</span>${msg}`;
    const log = document.getElementById('log');
    log.insertBefore(el, log.firstChild);
    if (log.children.length > 30) log.lastChild.remove();
  }

  function renderList() {
    const box = document.getElementById('list-box');
    const content = document.getElementById('list-content');
    if (state.bukuList.length === 0) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    document.getElementById('list-count').textContent = state.bukuList.length + ' buku';
    content.innerHTML = state.bukuList.map((b, i) => `
      <div class="list-item">
        <div class="list-num">${i + 1}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;color:#0f172a;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
            ${escapeHtml(b.judul)}
          </div>
          <div style="font-size:0.7rem;color:#64748b;font-family:'JetBrains Mono',monospace;margin-top:2px;">
            ${escapeHtml(b.kode_buku)}
          </div>
        </div>
        <button onclick="hapusBuku(${b.id})"
          style="color:#94a3b8;background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;transition:all 0.15s;"
          onmouseover="this.style.color='#dc2626';this.style.background='#fef2f2';"
          onmouseout="this.style.color='#94a3b8';this.style.background='transparent';">
          ${svgIcon('x', 16)}
        </button>
      </div>
    `).join('');
  }

  function hapusBuku(id) {
    state.bukuList = state.bukuList.filter(b => b.id !== id);
    renderList();
    addLog('Hapus 1 buku dari list', 'warn');
    document.getElementById('scan-input').focus();
  }

  async function processScan(kode) {
    try {
      const res = await apiGet('/scan/lookup/' + encodeURIComponent(kode));
      
      if (res.tipe === 'buku') {
        if (state.bukuList.find(b => b.id === res.data.id)) {
          beepWarn(); showStatus('Sudah Discan', res.data.judul, 'warn'); return;
        }
        state.bukuList.push({ id: res.data.id, kode_buku: res.data.kode_buku, judul: res.data.judul });
        beepOk();
        showStatus('Buku Ditambah', res.data.judul, 'success');
        addLog('+ ' + escapeHtml(res.data.judul), 'success');
        renderList();
        return;
      }
      
      if (res.tipe === 'anggota') {
        // JIKA SCAN KARTU: Deteksi niat siswa secara otomatis
        if (state.bukuList.length > 0) {
          await prosesSemua(res.data, 'pinjam'); // Keranjang ada isi = Niat Pinjam
        } else {
          await prosesTamu(res.data, 'baca');    // Keranjang kosong = Niat Baca di Tempat
        }
      }
    } catch (err) {
      beepErr(); showStatus('Tidak Dikenali', err.message, 'error');
      addLog(err.message, 'error');
    }
  }

  // ================================================================
  // FUNGSI PINJAM BUKU
  // ================================================================
  async function prosesSemua(anggota, niat) {
    try {
      showStatus('Memproses...', anggota.nama, 'processing');
      addLog(escapeHtml(anggota.nama) + ' (' + anggota.nis + ') — proses ' + state.bukuList.length + ' buku', 'info');
      
      // 1. Simpan Peminjaman
      const res = await apiPost('/scan/proses', {
        anggota_id: anggota.id,
        buku_list: state.bukuList.map(b => ({ buku_id: b.id, jumlah: 1 })),
        force_return: state.forceReturn // <--- TAMBAHKAN INI
      });

      // 2. Catat ke Buku Tamu sebagai 'pinjam'
      await apiPost('/scan/tamu', { anggota_id: anggota.id, tujuan: 'pinjam' });

      beepBig();
      const nK = res.pengembalian ? res.pengembalian.length : 0;
      const nP = res.peminjaman ? res.peminjaman.buku.length : 0;
      showStatus('Selesai', nK + ' kembali, ' + nP + ' pinjam', 'success');
      addLog('Selesai — ' + nK + ' kembali, ' + nP + ' pinjam', 'success');
      tampilkanSukses(anggota, res);
      
      state.bukuList = [];
      state.forceReturn = false; // <--- RESET
      document.getElementById('toggle-force-return').checked = false; // <--- RESET UI
      document.getElementById('label-force-return').style.background = '#f1f5f9';
      document.getElementById('label-force-return').style.color = '#475569';
      renderList();
      
      setTimeout(() => {
        document.getElementById('modal-sukses').style.display = 'none';
        showStatus('Siap Scan', 'Scan buku untuk pinjam, atau kartu untuk baca', 'info');
      }, 3000);
    } catch (err) {
      beepErr(); showStatus('Gagal', err.message, 'error');
      addLog(err.message, 'error');
    }
  }

  // ================================================================
  // FUNGSI BARU: BUKU TAMU (BACA DI TEMPAT)
  // ================================================================
  async function prosesTamu(anggota, tujuan = 'baca') {
    try {
      const res = await apiPost('/scan/tamu', { anggota_id: anggota.id, tujuan });
      const teksTujuan = tujuan === 'pinjam' ? 'MEMINJAM BUKU' : 'BACA DI TEMPAT';
      
      if (res.tipe === 'masuk') {
        beepOk(); setTimeout(beepOk, 150);
        
        document.getElementById('status-box').className = `card p-8 text-center shadow-lg border-2 transition-all bg-green-50 border-green-300`;
        document.getElementById('status-icon-wrap').className = 'success';
        document.getElementById('status-icon-wrap').innerHTML = svgIcon('check', 34);
        document.getElementById('status-text').className = `text-3xl font-bold mt-4`;
        document.getElementById('status-text').style.color = '#047857';
        document.getElementById('status-text').textContent = res.anggota.nama.toUpperCase();
        
        document.getElementById('status-sub').innerHTML = `
          <div class="text-lg mt-2 font-medium">Selamat Datang!</div>
          <div class="text-sm mt-2 text-slate-500 font-semibold uppercase">${teksTujuan}</div>
          <div class="text-sm mt-1 text-slate-500">Jam ${res.waktu}</div>
        `;
        addLog(`📥 Masuk: ${res.anggota.nama} (${teksTujuan})`, 'success');

      } else if (res.tipe === 'sudah') {
        beepWarn(); 
        document.getElementById('status-box').className = `card p-8 text-center shadow-lg border-2 transition-all bg-blue-50 border-blue-300`;
        document.getElementById('status-icon-wrap').className = 'processing';
        document.getElementById('status-icon-wrap').innerHTML = svgIcon('alert', 34);
        document.getElementById('status-text').className = `text-3xl font-bold mt-4`;
        document.getElementById('status-text').style.color = '#1d4ed8';
        document.getElementById('status-text').textContent = res.anggota.nama.toUpperCase();
        
        document.getElementById('status-sub').innerHTML = `
          <div class="text-lg mt-2 font-medium">Anda sudah tercatat hari ini.</div>
          <div class="text-sm mt-1 text-slate-500">Silakan nikmati fasilitas perpustakaan.</div>
        `;
        addLog(`ℹ️ ${res.anggota.nama} sudah discan hari ini`, 'info');
      }

      setTimeout(() => { 
        showStatus('Siap Scan', 'Scan Buku untuk pinjam, atau Kartu untuk baca', 'info'); 
      }, 3000);

    } catch (err) {
      beepErr(); showStatus('Gagal', err.message, 'error');
    }
  }

  function tampilkanSukses(anggota, res) {
    document.getElementById('sukses-sub').textContent =
      anggota.nama + ' · ' + anggota.nis + (anggota.kelas ? ' · ' + anggota.kelas : '');
    let html = '';
    if (res.pengembalian && res.pengembalian.length) {
      html += `
        <div style="background:#f0fdf4;border:1px solid #a7f3d0;border-radius:12px;padding:14px;">
          <div style="font-weight:700;color:#047857;font-size:0.75rem;margin-bottom:8px;
                      letter-spacing:0.04em;text-transform:uppercase;">
            Dikembalikan (${res.pengembalian.length})
          </div>
          <ul style="list-style:none;display:flex;flex-direction:column;gap:6px;font-size:0.85rem;color:#0f172a;">
            ${res.pengembalian.map(b => `
              <li style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
                <span>${escapeHtml(b.judul)}</span>
                ${b.denda > 0
                  ? `<span style="color:#dc2626;font-size:0.75rem;font-weight:600;">Rp ${b.denda.toLocaleString('id-ID')}</span>`
                  : '<span style="color:#059669;font-size:0.75rem;font-weight:600;">OK</span>'}
              </li>
            `).join('')}
          </ul>
        </div>`;
    }
    if (res.peminjaman && res.peminjaman.buku.length) {
      html += `
        <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:14px;">
          <div style="font-weight:700;color:#1d4ed8;font-size:0.75rem;margin-bottom:8px;
                      letter-spacing:0.04em;text-transform:uppercase;">
            Dipinjam (${res.peminjaman.buku.length})
          </div>
          <ul style="list-style:none;display:flex;flex-direction:column;gap:6px;font-size:0.85rem;color:#0f172a;">
            ${res.peminjaman.buku.map(b => `<li>${escapeHtml(b.judul)}</li>`).join('')}
          </ul>
          <div style="font-size:0.75rem;color:#1d4ed8;margin-top:10px;padding-top:10px;
                      border-top:1px solid #bfdbfe;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <span>Kode: <b style="font-family:'JetBrains Mono',monospace;">${escapeHtml(res.peminjaman.kode_pinjam)}</b></span>
            <span>Jatuh tempo: <b>${res.peminjaman.tanggal_jatuh}</b></span>
          </div>
        </div>`;
    }
    document.getElementById('sukses-detail').innerHTML = html;
    document.getElementById('modal-sukses').style.display = 'flex';
  }

  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('scan-input');
    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const kode = input.value.trim();
        input.value = '';
        if (!kode || state.processing) return;
        state.processing = true;
        try { await processScan(kode); }
        finally { state.processing = false; input.focus(); }
      }
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('button, select, a, input')) input.focus();
    });
    setInterval(() => { if (document.activeElement.tagName === 'BODY') input.focus(); }, 1000);
    document.getElementById('btn-exit').addEventListener('click', keluar);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.fullscreenElement) keluar(); });
    document.getElementById('btn-clear-log').addEventListener('click', () => {
      document.getElementById('log').innerHTML = '';
      input.focus();
    });
    setTimeout(() => input.focus(), 200);
    addLog('Mode Scan siap — scan buku dulu, lalu kartu', 'success');
        const toggleReturn = document.getElementById('toggle-force-return');
    const labelReturn = document.getElementById('label-force-return');
    toggleReturn.addEventListener('change', (e) => {
      state.forceReturn = e.target.checked;
      if (state.forceReturn) {
        labelReturn.style.background = '#fee2e2';
        labelReturn.style.color = '#b91c1c';
        addLog('Mode: Pengembalian Buku aktif', 'warn');
      } else {
        labelReturn.style.background = '#f1f5f9';
        labelReturn.style.color = '#475569';
        addLog('Mode: Normal (Perpanjang Otomatis)', 'info');
      }
    });
  });

  window.hapusBuku = hapusBuku;
  </script>
  <script src="/js/pengingat-domain.js"></script>
</body>
