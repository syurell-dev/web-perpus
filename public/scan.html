<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Scan - Perpustakaan Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.011em;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      color: #0f172a;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(15,23,42,0.04), 0 1px 2px rgba(15,23,42,0.03);
    }

    .scan-input {
      width: 100%; padding: 18px 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem; font-weight: 500; color: #0f172a;
      background: #fff; border: 2px solid #a7f3d0;
      border-radius: 12px; outline: none;
      transition: all 0.2s ease;
    }
    .scan-input::placeholder { color: #94a3b8; }
    .scan-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16,185,129,0.12), 0 4px 12px -4px rgba(16,185,129,0.25);
    }

    /* Status icon */
    #status-icon-wrap {
      width: 68px; height: 68px; margin: 0 auto 14px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #ecfdf5, #d1fae5);
      color: #059669;
      transition: all 0.3s ease;
    }
    #status-icon-wrap svg { width: 34px; height: 34px; }
    #status-icon-wrap.success { background: linear-gradient(135deg, #ecfdf5, #a7f3d0); color: #047857; }
    #status-icon-wrap.error   { background: linear-gradient(135deg, #fef2f2, #fecaca); color: #b91c1c; }
    #status-icon-wrap.warn    { background: linear-gradient(135deg, #fffbeb, #fde68a); color: #b45309; }
    #status-icon-wrap.processing { background: linear-gradient(135deg, #eff6ff, #bfdbfe); color: #1d4ed8; }

    .list-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: #f0fdf4; border: 1px solid #a7f3d0; border-radius: 12px;
      animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      transition: all 0.2s ease;
    }
    .list-item:hover { border-color: #34d399; transform: translateX(2px); }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .list-num {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.8rem; flex-shrink: 0;
    }

    .log-item {
      padding: 7px 11px; border-left: 2px solid #e2e8f0;
      font-size: 0.78rem; line-height: 1.5;
      animation: fadeIn 0.25s ease;
    }
    .log-item.success { border-left-color: #10b981; color: #047857; }
    .log-item.error   { border-left-color: #ef4444; color: #b91c1c; }
    .log-item.warn    { border-left-color: #f59e0b; color: #b45309; }
    .log-item.info    { border-left-color: #cbd5e1; color: #475569; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .log-time { color: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; margin-right: 6px; }

    .section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #64748b;
    }

    #btn-exit {
      width: 44px; height: 44px; border-radius: 12px;
      background: #fff; border: 1px solid #e2e8f0; color: #475569;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s ease;
    }
    #btn-exit:hover {
      background: #fef2f2; border-color: #fecaca; color: #dc2626;
    }

    .icon { width: 16px; height: 16px; flex-shrink: 0; }
    .icon-lg { width: 20px; height: 20px; flex-shrink: 0; }

    #modal-sukses { animation: fadeIn 0.2s ease; }
    #modal-sukses > div { animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.94) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/pengingat.css">
  <link rel="stylesheet" href="/css/print.css" media="print">
</head>
<body>
  <div style="padding: 24px; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- HEADER -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
      <div>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
          <span style="width: 8px; height: 8px; background: #10b981; border-radius: 50%;
                       box-shadow: 0 0 0 4px rgba(16,185,129,0.15);"></span>
          <span style="font-size: 0.7rem; font-weight: 700; color: #059669;
                       letter-spacing: 0.08em; text-transform: uppercase;">
            Scanner Aktif
          </span>
        </div>
        <h1 style="font-size: 1.7rem; font-weight: 800; color: #0f172a; letter-spacing: -0.03em;">
          Mode Scan
        </h1>
        <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">
          Scan buku satu-satu, lalu scan kartu anggota — diproses otomatis
        </p>
      </div>
      <button id="btn-exit" title="Keluar (Esc)">
        <svg class="icon-lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <!-- GRID -->
    <div style="display: grid; grid-template-columns: 1fr 340px; gap: 20px; flex: 1; min-height: 0;">

      <!-- LEFT -->
      <div style="display: flex; flex-direction: column; gap: 16px; min-height: 0;">

                <!-- INPUT -->
        <div class="card" style="padding: 22px;">
          <!-- Header: Judul & Tombol Kanan Atas -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div class="section-title">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
              </svg>
              Scan Barcode
            </div>
            
            <!-- Wadah Tombol Kecil -->
            <div style="display: flex; gap: 8px;">
              <button id="btn-mode-nonton" type="button" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="3" rx="2" ry="2"/><polygon points="10 9 15 12 10 15 10 9"/></svg>
                Nonton
              </button>
              
              <button id="btn-mode-paket" type="button" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; font-size: 0.75rem; font-weight: 700; cursor: pointer;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                Mode Paket
              </button>
            </div>
          </div>

          <!-- Input Scan -->
          <input id="scan-input" type="text" autocomplete="off" class="scan-input" placeholder="Scan Buku ATAU Scan NIS...">
          
          <!-- Tombol Kembalikan (Besar di Bawah) -->
          <div style="margin-top: 16px;">
            <button id="btn-mode-perpanjang" type="button" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 12px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; color: #475569; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s;">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              Mode Perpanjang Buku
            </button>
          </div>
        </div>

        <!-- STATUS -->
        <div id="status-box" class="card" style="padding: 28px; text-align: center; transition: all 0.3s ease;">
          <div id="status-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
            </svg>
          </div>
          <div id="status-text" style="font-size: 1.15rem; font-weight: 700; color: #0f172a; letter-spacing: -0.01em;">
            Siap Scan Buku
          </div>
          <div id="status-sub" style="font-size: 0.85rem; color: #64748b; margin-top: 6px;">
            Scan buku yang mau dipinjam atau dikembalikan
          </div>
        </div>

        <!-- LIST -->
        <div id="list-box" class="card" style="padding: 20px; flex: 1; overflow-y: auto; min-height: 0; display: none;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
            <div class="section-title">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                <path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
              </svg>
              Buku Ter-scan
            </div>
            <span id="list-count" style="font-size: 0.7rem; background: #d1fae5; color: #047857;
                                          padding: 4px 10px; border-radius: 999px; font-weight: 700;">
              0 buku
            </span>
          </div>
          <div id="list-content" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

      </div>

      <!-- RIGHT: LOG -->
      <div class="card" style="padding: 20px; overflow-y: auto; min-height: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
          <div class="section-title">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>
            </svg>
            Aktivitas
          </div>
          <button id="btn-clear-log" style="font-size: 0.72rem; color: #94a3b8; background: none;
                                             border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px;">
            Clear
          </button>
        </div>
        <div id="log" style="display: flex; flex-direction: column;"></div>
      </div>

    </div>
  </div>

  <!-- MODAL SUKSES -->
  <div id="modal-sukses" style="display: none; position: fixed; inset: 0; z-index: 9999;
                                  background: rgba(15,23,42,0.5); backdrop-filter: blur(4px);
                                  align-items: center; justify-content: center; padding: 16px;">
    <div style="background: #fff; border-radius: 20px; padding: 32px;
                max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto;
                box-shadow: 0 25px 50px -12px rgba(15,23,42,0.25);">
      <div style="text-align: center; margin-bottom: 20px;">
        <div style="width: 76px; height: 76px; background: linear-gradient(135deg, #ecfdf5, #a7f3d0);
                    border-radius: 20px; display: flex; align-items: center; justify-content: center;
                    margin: 0 auto 14px; color: #047857;">
          <svg style="width:38px;height:38px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </div>
        <h2 style="font-size: 1.4rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">Selesai!</h2>
        <p id="sukses-sub" style="color: #64748b; font-size: 0.85rem; margin-top: 4px;"></p>
      </div>
      <div id="sukses-detail" style="text-align: left; display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/scan.js"></script>
  <script src="/js/pengingat-domain.js"></script>
</body>
</html>
