<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Perpustakaan SMPN 1 Taman</title>
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 40%, #f1f5f9 100%);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.011em;
      position: relative;
      overflow: hidden;
    }

    /* Dekorasi background subtle */
    body::before {
      content: '';
      position: fixed;
      top: -20%; right: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(5,150,105,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%; left: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(245,158,11,0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow:
        0 1px 3px rgba(15,23,42,0.04),
        0 20px 40px -12px rgba(15,23,42,0.12),
        0 0 0 1px rgba(15,23,42,0.04);
      position: relative;
      z-index: 1;
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border-radius: 14px;
      padding: 6px;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      box-shadow: 0 4px 12px rgba(5,150,105,0.15);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 2px;
      font-weight: 500;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 16px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-wrap input::placeholder { color: #94a3b8; }

    .input-wrap input:hover:not(:focus) { border-color: #cbd5e1; }

    .input-wrap input:focus {
      background: #fff;
      border-color: #059669;
      box-shadow: 0 0 0 4px rgba(5,150,105,0.12);
    }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      pointer-events: none;
      transition: color 0.18s;
    }

    .input-wrap input:focus ~ .input-icon { color: #059669; }

    .btn-submit {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #059669, #047857);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s;
      box-shadow: 0 4px 12px rgba(5,150,105,0.3);
      letter-spacing: 0.01em;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(5,150,105,0.4);
    }

    .btn-submit:active:not(:disabled) { transform: translateY(0); }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
      animation: alertIn 0.25s ease;
    }

    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .alert.show { display: flex; }

    .alert.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .alert.info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }

    .alert svg { flex-shrink: 0; margin-top: 1px; }

    .footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .footer b { color: #64748b; font-weight: 600; }

    @media (max-width: 480px) {
      .login-card { padding: 36px 28px; border-radius: 20px; }
      .brand-text h1 { font-size: 1.3rem; }
    }
  </style>
  <link rel="stylesheet" href="/css/print.css" media="print">
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <img src="/img/logo.png" alt="Logo" class="brand-logo">
      <div class="brand-text">
        <h1>Perpustakaan</h1>
        <p>SMPN 1 Taman · Sidoarjo</p>
      </div>
    </div>

    <p class="subtitle" id="subtitle">Masuk untuk melanjutkan ke aplikasi</p>

    <div id="msg" class="alert"></div>

    <form id="form-login" autocomplete="on">
      <!-- STEP LOGIN -->
      <div id="step-login">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <input type="text" id="username" required autocomplete="username" placeholder="Masukkan username atau nis">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" required autocomplete="current-password" placeholder="Masukkan password">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">Masuk</button>
      </div>

      <!-- STEP CHANGE PASSWORD -->
      <div id="step-change" style="display:none;">
        <div class="field">
          <label for="old_password">Password Lama</label>
          <div class="input-wrap">
            <input type="password" id="old_password" autocomplete="current-password" placeholder="Password lama">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
        </div>

        <div class="field">
          <label for="new_password">Password Baru</label>
          <div class="input-wrap">
            <input type="password" id="new_password" autocomplete="new-password" placeholder="Minimal 8 karakter">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
        </div>

        <div class="field">
          <label for="confirm_password">Konfirmasi Password Baru</label>
          <div class="input-wrap">
            <input type="password" id="confirm_password" autocomplete="new-password" placeholder="Ketik ulang password baru">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </div>
        </div> <!-- Menutup field konfirmasi -->

        <button type="submit" class="btn-submit" id="btn-change">Simpan & Lanjut</button>
      </div> <!-- Menutup div id="step-change" -->
    </form> <!-- Menutup form-login -->

        <!-- Info Login Pertama (Yang Rapi) -->
    <div style="margin-top: 24px; padding: 16px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; display: flex; gap: 12px; text-align: left;">
      <div style="color: #64748b; flex-shrink: 0; margin-top: 2px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      </div>
      <div>
        <div style="font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 4px;">Info Login Siswa & Guru</div>
        <div style="font-size: 12px; color: #475569; line-height: 1.5;">
          Gunakan <b>NIS</b> sebagai Username dan Password untuk login pertama kali.
        </div>
      </div>
    </div>

    <!-- Footer (Hanya satu ini saja) -->
    <div class="footer" style="margin-top: 20px;">
      Aplikasi Perpustakaan · <b>SMPN 1 Taman Sidoarjo</b>
    </div>

  </div> <!-- Penutup login-card -->

  <script>
    // (Biarkan kode JS Anda di bawah sini)
    const msg = document.getElementById('msg');
    const form = document.getElementById('form-login');
    const stepLogin = document.getElementById('step-login');
    const stepChange = document.getElementById('step-change');
    const subtitle = document.getElementById('subtitle');
    let changing = false;

    const ICON_ERROR = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>';
    const ICON_INFO  = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';

    function showMsg(text, type = 'error') {
      msg.className = 'alert ' + type + ' show';
      msg.innerHTML = (type === 'error' ? ICON_ERROR : ICON_INFO) + '<span>' + text + '</span>';
    }
    function hideMsg() { msg.className = 'alert'; }

    if (location.search.includes('change=1')) {
      showMsg('Anda harus mengganti kata sandi terlebih dahulu.', 'info');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();

      if (!changing) {
        // ---- LOGIN ----
        const btn = document.getElementById('btn-login');
        btn.disabled = true; btn.textContent = 'Memproses...';
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              username: document.getElementById('username').value.trim(),
              password: document.getElementById('password').value
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || data.error || 'Login gagal');

          if (data.mustChangePw) {
            changing = true;
            stepLogin.style.display = 'none';
            stepChange.style.display = 'block';
            subtitle.textContent = 'Buat kata sandi baru untuk melanjutkan';
            showMsg('Login berhasil. Silakan ganti kata sandi Anda.', 'info');
            setTimeout(() => document.getElementById('old_password').focus(), 100);
          } else {
            location.href = '/';
          }
        } catch (err) {
          showMsg(err.message);
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        } finally {
          btn.disabled = false; btn.textContent = 'Masuk';
        }
      } else {
        // ---- CHANGE PASSWORD ----
        const oldP = document.getElementById('old_password').value;
        const newP = document.getElementById('new_password').value;
        const confP = document.getElementById('confirm_password').value;

        if (newP !== confP) return showMsg('Konfirmasi password tidak cocok');
        if (newP.length < 8) return showMsg('Password minimal 8 karakter');

        const btn = document.getElementById('btn-change');
        btn.disabled = true; btn.textContent = 'Menyimpan...';
        try {
          const res = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ old_password: oldP, new_password: newP })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || data.error || 'Gagal ganti password');
          location.href = '/';
        } catch (err) {
          showMsg(err.message);
          btn.disabled = false; btn.textContent = 'Simpan & Lanjut';
        }
      }
    });

    // Auto-focus username
    setTimeout(() => document.getElementById('username').focus(), 100);
  </script>
</body>
</html>
